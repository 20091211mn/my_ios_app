name: Build Fast iOS IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install System Dependencies
      run: |
        brew install autoconf automake libtool pkg-config
        python -m pip install --upgrade pip
        pip install cython kivy-ios

    - name: Cache Kivy-iOS Built Recipes
      uses: actions/cache@v3
      with:
        path: ~/.kivy-ios
        key: ${{ runner.os }}-kivy-ios-recipes

    - name: Build Python3 and Kivy Recipes
      run: |
        toolchain build python3 kivy

    - name: Create Xcode Project with toolchain
      run: |
        toolchain create myiosapp .

    - name: Fast Build App & Package IPA
      run: |
        cd myiosapp-ios
        
        # بناء التطبيق مباشرة لنسبة توافق أعلى
        xcodebuild -project myiosapp.xcodeproj \
                   -scheme myiosapp \
                   -sdk iphoneos \
                   -configuration Release \
                   CODE_SIGN_IDENTITY="" \
                   CODE_SIGNING_REQUIRED=NO \
                   CODE_SIGNING_ALLOWED=NO \
                   IPHONEOS_DEPLOYMENT_TARGET=12.0 \
                   build

        # إنشاء مجلد الـ IPA وتغليفه
        mkdir -p build/Payload
        cp -r build/Release-iphoneos/*.app build/Payload/ 2>/dev/null || cp -r build/Products/Release-iphoneos/*.app build/Payload/ 2>/dev/null || cp -r myiosapp-ios/build/Release-iphoneos/*.app build/Payload/ 2>/dev/null || true
        
        # إذا لم يجد التطبيق في المسارات السابقة، جلب التطبيق المجمع مباشرة
        find . -name "*.app" -type d -exec cp -r {} build/Payload/ \;
        
        cd build
        zip -q -r myiosapp.ipa Payload

    - name: Upload IPA Artifact
      uses: actions/upload-artifact@v4
      with:
        name: iOS-IPA-Package
        path: myiosapp-ios/build/myiosapp.ipa
