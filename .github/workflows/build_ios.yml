name: Build Fast iOS IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install System Dependencies
      run: |
        brew install autoconf automake libtool pkg-config
        python -m pip install --upgrade pip
        pip install cython kivy-ios

    - name: Cache Kivy-iOS Downloads & Build
      uses: actions/cache@v3
      with:
        path: |
          ~/.kivy-ios
          build
          dist
        key: ${{ runner.os }}-kivy-ios-cache-v3

    - name: Build Python3 and Kivy Recipes
      run: |
        toolchain build python3 kivy || toolchain build python3 kivy

    - name: Create Xcode Project with toolchain
      run: |
        toolchain create myiosapp .

    - name: Full App Bundle & Package IPA
      run: |
        cd myiosapp-ios
        
        # إنشاء المجلدات الوهمية لمنع خطأ rsync
        mkdir -p YourApp/images
        touch YourApp/pictures.kv YourApp/shadow32.png YourApp/images/faust_github.jpg YourApp/images/.empty
        
        # بناء مشروع Xcode وتجميع المكاتب بالكامل
        xcodebuild -project myiosapp.xcodeproj \
                   -scheme myiosapp \
                   -sdk iphoneos \
                   -configuration Release \
                   CODE_SIGN_IDENTITY="" \
                   CODE_SIGNING_REQUIRED=NO \
                   CODE_SIGNING_ALLOWED=NO \
                   IPHONEOS_DEPLOYMENT_TARGET=12.0 \
                   build

        # تجهيز Payload وتضمين كافة مكاتب ورزم Python/Kivy
        mkdir -p build/Payload
        cp -R build/Release-iphoneos/myiosapp.app build/Payload/ 2>/dev/null || cp -R build/Products/Release-iphoneos/myiosapp.app build/Payload/ 2>/dev/null || find . -name "*.app" -type d -exec cp -R {} build/Payload/ \;
        
        cd build
        zip -r -9 myiosapp.ipa Payload

    - name: Upload IPA Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Full-iOS-IPA-Package
        path: myiosapp-ios/build/myiosapp.ipa
